name: healthtrack
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  pdf: ^3.10.7
  printing: ^5.12.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  socket_io_client: ^3.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.1
  overlay_support: ^2.1.0
  network_info_plus: ^6.1.1
  cupertino_icons: ^1.0.8
  csv: ^6.0.0
  path_provider: ^2.1.5
  excel: ^3.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  table_calendar: ^3.0.9
  fl_chart: ^1.1.1
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logoadmin.png
    - assets/images/profile.png
    - assets/images/bluebackground.png
    - assets/images/health_image.png.png
    - assets/images/adminbackground.png